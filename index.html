<!DOCTYPE html>
<html lang="am"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ለአንቺ ብቻ ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#2a0a1f;--bg2:#6b1d4a;--ink:#fff;--accent:#ff4d85}
html{height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;font-family:'Noto Sans Ethiopic','Nyala','Abyssinica SIL',sans-serif;color:var(--ink);background:radial-gradient(circle at 30% 20%,var(--bg2),var(--bg1));overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
.screen.on{display:flex}
h1{font-size:clamp(1.4rem,6vw,2.2rem);margin:0;line-height:1.35}
p{margin:0;opacity:.9;line-height:1.5}
input{padding:14px 18px;border-radius:30px;border:2px solid var(--accent);background:#ffffff14;color:#fff;font:inherit;font-size:1.1rem;text-align:center;width:min(300px,80vw);user-select:text}
input::placeholder{color:#ffffff99}
button{font:inherit;cursor:pointer;border:0;border-radius:30px;padding:14px 26px;background:var(--accent);color:#fff;font-size:1.05rem;box-shadow:0 6px 20px #0006}
button:active{transform:scale(.96)}
.err{color:#ffb3c8;min-height:1.3em}
#runner{position:fixed;z-index:5;transition:left .25s,top .25s}
.card{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000a;padding:24px}
.card.on{display:flex}
.card>div{background:#fff;color:#4a0f33;border-radius:22px;padding:22px;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:14px;font-size:1.15rem;animation:pop .35s}
@keyframes pop{from{transform:scale(.5);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.polaroid{background:#fff;color:#4a0f33;padding:14px 14px 18px;border-radius:6px;box-shadow:0 20px 50px #000a;width:min(300px,78vw);transform:rotate(-3deg);animation:drop 1.4s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-120vh) rotate(25deg)}}
.polaroid .ph{aspect-ratio:1;background:#f3d5e0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:3px}
.polaroid img{width:100%;height:100%;object-fit:cover}
.polaroid label{cursor:pointer;padding:12px;font-size:.95rem}
.cap{margin-top:12px}
.heart{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh)}}
</style></head><body>

<script>
/* ✏️ እነዚህን ብቻ ቀይር / EDIT THESE */
const PASSWORDS=["14022023"];   // የተገናኛችሁበት ቀን (ቀን ወር ዓመት) ቁጥር ብቻ: DDMMYYYY. ብዙ ቀን መጨመር ትችላለህ ["14022023","20032023"]
const PHOTO="photo.jpg";        // የመጀመሪያ ፎቶአችሁ (ከ index.html ጎን ያስቀምጡት)
const VIDEOS=["hug1.mp4"];   // ⬅️ changed: only one video now
const KM=3580;                  // በመካከላችሁ ያለው ርቀት በኪ.ሜ
const CAPTION="የመጀመሪያ ቀጠሯችን — ሁሉ ነገር የጀመረበት ቀን 💕";
</script>

<div class="screen on" id="s1">
  <div style="font-size:3rem">🔒</div>
  <h1>ለአንቺ ብቻ ፍቅሬ</h1>
  <p>ለመጀመሪያ ጊዜ የተገናኘንበት<br>ወይም በስልክ ያወራንበት ቀን መቼ ነው?</p>
  <input id="pw" placeholder="ቀን/ወር/ዓመት" inputmode="numeric" autocomplete="off">
  <button id="go">ክፈቺ ❤️</button>
  <div class="err" id="err"></div>
</div>

<div class="screen" id="s2">
  <h1>ምን ያህል እንደምትወጂኝ አረጋግጪ 💘</h1>
  <p>ከታች ያለውን ቁልፍ ተጫኚ…</p>

</div>
<button id="runner" style="display:none">አዎ፣ በእውነት እወድሃለሁ ❤️</button>

<div class="card" id="card"><div><span id="cardTxt"></span><button id="again">እንደገና ሞክሪ 💪</button></div></div>

<div class="screen" id="s3">
  <h1>🎉 እንኳን ደስ አለሽ! 🎉</h1>
  <p>ፍቅርሽን አረጋግጠሻል። በአንቺ ፈጽሞ አልጠራጠርም።</p>
  <h1 style="margin-top:12px">አብረን ያሳለፍነውን ለማየት ዝግጁ ነሽ?</h1>
  <button id="ready">አዎ! 😍</button>
</div>

<div class="screen" id="s4">
  <div class="polaroid"><div class="ph" id="ph"></div><div class="cap" id="cap"></div></div>
  <p>በመካከላችን ያለው ርቀት ቁጥር ብቻ ነው። 🌍</p>
  <button id="next">አንድ ሌላ ድንገተኛ ነገር →</button>
</div>

<div class="screen" id="s5" style="gap:10px">
  <h1>📦 የእቅፍ ማድረሻ አገልግሎት</h1>
  <svg id="map" viewBox="0 0 700 500" style="width:min(560px,94vw);border-radius:18px;box-shadow:0 10px 30px #0008;max-height:46vh"></svg>
  <div id="tkm" style="font-size:1.25rem;color:#ffd1e1">ለመነሳት ዝግጁ</div>
  <div id="tstat" style="min-height:2.8em;max-width:420px;font-size:.98rem">ናፍቄሽ ነው? አስቸኳይ እቅፍ እዘዢ — ኢትዮጵያ → ዱባይ!</div>
  <button id="roll">እቅፍ እዘዢ 🤗</button>
  <label style="cursor:pointer;font-size:.8rem;opacity:.5">🎬 (አንተ) ቪዲዮ ጨምር <input type="file" accept="video/*" hidden id="vf"></label>
</div>
<div class="card" id="vcard"><div style="width:min(440px,92vw)">
  <b id="vcap"></b>
  <video id="vid" controls playsinline style="width:100%;max-height:58vh;border-radius:14px;background:#000"></video>
  <label id="vpick" style="display:none;cursor:pointer;padding:30px 10px;border:2px dashed #c04a80;border-radius:14px">🎬 ይህን የእቅፍ ቪዲዮ ለመምረጥ ንኪ<input type="file" accept="video/*" hidden id="vf1"></label>
  <button id="vclose">ዝጋ 💖</button>
</div></div>
<canvas id="fx"></canvas>

<script>
const $=id=>document.getElementById(id);
const show=n=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(n).classList.add('on')};
const norm=s=>s.replace(/\D/g,'');

/* Telegram Mini App setup */
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#2a0a1f');tg.setBackgroundColor('#2a0a1f');if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}catch(e){}}
const buzz=t=>{try{tg&&tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};

/* floating hearts */
setInterval(()=>{const h=document.createElement('div');h.className='heart';h.textContent=['❤️','💖','💕'][Math.random()*3|0];
h.style.left=Math.random()*100+'vw';h.style.fontSize=14+Math.random()*22+'px';h.style.animationDuration=6+Math.random()*6+'s';
document.body.appendChild(h);setTimeout(()=>h.remove(),12000)},700);

/* 1. password */
function login(){ if(PASSWORDS.map(norm).includes(norm($('pw').value))){buzz('medium');startChase()} else {buzz('heavy');$('err').textContent='ወይኔ፣ ትክክል አይደለም… ያን ቀን አስታውሺ 🥺'} }
$('go').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};

/* 2. chase */
let stage=0,idle,moved=false;const R=$('runner');
const msgs=["ፍቅርሽን ተውሽው ወይስ ደከመሽ? 🥺","ለፍቅርሽ የምትሞክሪው ይሄ ብቻ ነው? 💔"];
function place(){const w=innerWidth-R.offsetWidth-16,h=innerHeight-R.offsetHeight-16;
 R.style.left=Math.max(8,Math.random()*w)+'px';R.style.top=Math.max(80,Math.random()*h)+'px'}
function startChase(){show('s2');R.style.display='block';place();arm()}
function arm(){clearTimeout(idle);idle=setTimeout(()=>{ if(stage<2&&moved){ $('cardTxt').textContent=msgs[stage];$('card').classList.add('on');}},3500)}
function dodge(){ if(stage>=2)return; moved=true; buzz('light'); place(); arm(); $('hint').textContent=['ያዢው! 😏','በጣም ቀርፋፋ ነሽ!','ልትደርሺበት ነው…','እጅ አትስጪ!'][Math.random()*4|0]}
document.addEventListener('pointermove',e=>{ if(stage>=2||R.style.display==='none')return;
 const r=R.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 if(Math.hypot(e.clientX-cx,e.clientY-cy)<r.width*0.5+25)dodge()});
R.addEventListener('pointerdown',e=>{ if(stage<2){e.preventDefault();dodge()}});
R.addEventListener('click',()=>{ if(stage>=2) win()});
$('again').onclick=()=>{ $('card').classList.remove('on');stage++;moved=false;
 if(stage>=2){ $('hint').textContent='እሺ… በዚህ ጊዜ ያንቺ ነው 💖';R.style.transform='scale(1.1)'}
 else {place();arm()} };

/* 3. win + fireworks */
function win(){buzz('heavy');R.style.display='none';show('s3');boom()}
$('ready').onclick=()=>{show('s4');reveal()};
const c=$('fx'),x=c.getContext('2d');let P=[];
function sz(){c.width=innerWidth;c.height=innerHeight}sz();addEventListener('resize',sz);
function burst(cx,cy){const col=Math.random()*360;for(let i=0;i<60;i++){const a=Math.random()*6.28,v=2+Math.random()*6;
 P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:80,c:`hsl(${col+Math.random()*40},100%,65%)`})}}
function boom(){let n=0;const t=setInterval(()=>{burst(innerWidth*Math.random(),innerHeight*(.15+Math.random()*.4));if(++n>14)clearInterval(t)},350);
 for(let i=0;i<120;i++)P.push({x:innerWidth/2,y:innerHeight,vx:(Math.random()-.5)*14,vy:-8-Math.random()*12,l:140,c:`hsl(${Math.random()*360},100%,65%)`,sq:1})}
(function loop(){x.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.l>0);
 for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.985;p.l--;x.globalAlpha=Math.min(1,p.l/40);x.fillStyle=p.c;
 p.sq?x.fillRect(p.x,p.y,7,10):(x.beginPath(),x.arc(p.x,p.y,2.5,0,6.3),x.fill())}
 requestAnimationFrame(loop)})();

/* 4. photo */
function chooser(){const ph=$('ph');ph.innerHTML='<label>📷 የመጀመሪያ ፎቶአችንን ለመምረጥ ንኪ<input type="file" accept="image/*" hidden></label>';
 ph.querySelector('input').onchange=e=>{const f=e.target.files[0];if(f){ph.innerHTML='<img>';ph.firstChild.src=URL.createObjectURL(f)}}}
function reveal(){const ph=$('ph');$('cap').textContent=CAPTION;
 if(PHOTO){const im=new Image();im.onload=()=>{ph.innerHTML='';ph.appendChild(im)};im.onerror=chooser;im.src=PHOTO}else chooser();
 setTimeout(()=>{for(let i=0;i<6;i++)setTimeout(()=>burst(innerWidth*Math.random(),innerHeight*.3),i*300)},1200)}
$('next').onclick=()=>show('s5');

/* 5. hug flight: Addis Ababa -> Dubai */
const X=lo=>(lo-30)*20,Y=la=>(36-la)*13.889;
const poly=a=>'M'+a.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('L')+'Z';
const AFR=[[30,31.2],[32.3,31.2],[32.6,29.9],[33.6,27.9],[34.9,25.1],[35.6,23.9],[37.2,19.6],[39.5,15.6],[42.7,13],[43.2,11.6],[45,10.4],[49.2,11.3],[51.3,11.8],[51.2,10.4],[49.8,8],[48.5,5.5],[45.5,2],[41.5,0],[30,0]];
const ASIA=[[30,45],[30,36.2],[36,36.2],[35.9,34.6],[35,32.8],[34.3,31.3],[32.3,31.1],[32.6,29.9],[33.5,28.3],[34.3,27.7],[34.9,29.5],[35.7,27.4],[38,24],[39.2,21.5],[42.5,16.9],[42.9,14.8],[43.3,13.2],[45,12.8],[49.1,14.5],[54,17],[56.5,17.9],[59.8,22.5],[58.6,23.6],[56.7,24.4],[56.4,26.3],[55.5,25.5],[54.4,24.5],[53,24.2],[51.6,24.5],[51.2,26.1],[50.1,26.4],[49.5,27.5],[48.3,29.3],[48.1,30],[49.2,30.2],[50.8,28.9],[52.5,27.5],[54.5,26.5],[56.2,27.1],[57.3,25.8],[61.5,25.2],[65,25.3],[65,45]];
const lbl=(lo,la,t,sz=12,o=.6,rot=0)=>`<text x="${X(lo)}" y="${Y(la)}" font-size="${sz}" fill="#fff" opacity="${o}" text-anchor="middle" ${rot?`transform="rotate(${rot} ${X(lo)} ${Y(la)})"`:''}>${t}</text>`;
let grid='';for(let lo=30;lo<=65;lo+=5)grid+=`<line x1="${X(lo)}" x2="${X(lo)}" y1="0" y2="500"/>`;for(let la=0;la<=36;la+=5)grid+=`<line y1="${Y(la)}" y2="${Y(la)}" x1="0" x2="700"/>`;
const A0=[X(38.75),Y(9.03)],A1=[X(55.27),Y(25.2)],C=[(A0[0]+A1[0])/2-34,(A0[1]+A1[1])/2-49];
const rd=`M${A0[0]} ${A0[1]} Q${C[0]} ${C[1]} ${A1[0]} ${A1[1]}`;
$('map').innerHTML=`<defs><linearGradient id="oc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#143a63"/><stop offset="1" stop-color="#0a1f3d"/></linearGradient></defs>
<rect width="700" height="500" fill="url(#oc)"/><g stroke="#ffffff18" stroke-width="1">${grid}</g>
<path d="${poly(AFR)}" fill="#3b6b57" stroke="#7fb89c" stroke-width="1.2"/><path d="${poly(ASIA)}" fill="#7a6a4a" stroke="#cdb98a" stroke-width="1.2"/>
${lbl(37,6.5,'ኢትዮጵያ',14)}${lbl(33,17,'ሱዳን',13)}${lbl(47,5,'ሶማሊያ',13)}${lbl(46.5,21,'ሳዑዲ ዓረቢያ',15)}${lbl(47,15.4,'የመን',11)}${lbl(57,21,'ኦማን',11)}${lbl(38.6,21.7,'ቀይ ባህር',10,.85,48)}${lbl(52,28.4,'ባህረ ሰላጤ',10,.85)}
<path d="${rd}" fill="none" stroke="#ffffff66" stroke-width="2" stroke-dasharray="3 7"/>
<path id="trail" d="${rd}" fill="none" stroke="#ff4d85" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="${A0[0]}" cy="${A0[1]}" r="6" fill="#ff4d85"/><text x="${A0[0]+10}" y="${A0[1]+18}" fill="#fff" font-size="15">አዲስ አበባ 🇪🇹</text>
<circle cx="${A1[0]}" cy="${A1[1]}" r="6" fill="#ffd54d"/><text x="${A1[0]-8}" y="${A1[1]-12}" text-anchor="end" fill="#fff" font-size="15">ዱባይ 🇦🇪</text>
<text id="plane" font-size="28" text-anchor="middle" dominant-baseline="central">✈️</text>`;
const route=document.createElementNS('http://www.w3.org/2000/svg','path');route.setAttribute('d',rd);
const RL=route.getTotalLength(),trail=$('trail'),plane=$('plane');trail.style.strokeDasharray=RL;
function setPlane(e){trail.style.strokeDashoffset=RL*(1-e);const p=route.getPointAtLength(e*RL),q=route.getPointAtLength(Math.min(RL,e*RL+2)),r=route.getPointAtLength(Math.max(0,e*RL-2));
 plane.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${Math.atan2(q.y-r.y,q.x-r.x)*180/Math.PI+45})`)}
setPlane(0);
const mishaps=["🛃 እቅፉ በጉምሩክ ተይዟል። ኦፊሰሩ «ለመላክ በጣም ያምራል» ይላል!","🐦 አንድ እርግብ እቅፉን ሰረቀው። እየተደራደርን ነው…","🧑‍✈️ አብራሪው ፎቶሽን እያየ ተዘናጋ። መንገድ እየቀየረ ነው!","🥶 እቅፉ ቀዘቀዘ። በተጨማሪ ፍቅር እያሞቅነው ነው…","☕ አብራሪው በ35,000 ጫማ ላይ ቡና ለመጠጣት ቆመ።"];
const SL=1,picked=[];let busy=false,n=0,cur=0;   // ⬅️ changed: SL = 1 video
function fly(){ if(busy)return;busy=true;buzz('medium');$('roll').textContent='✈️ በበረራ ላይ…';setPlane(0);
 const stops=[[0,'🛫 እቅፉ ታሽጓል! ቦሌ ዓለም አቀፍ አውሮፕላን ማረፊያ ላይ እየተሳፈረ ነው…'],[.2,'🌊 ቀይ ባህርን እያቋረጠ ነው…'],[.42,mishaps[Math.random()*mishaps.length|0]],[.65,'🏜️ ሳዑዲ ዓረቢያ ላይ እየበረረ ነው። እቅፉ አሁንም 100% ሞቅ ያለ ነው።'],[.88,'🛬 ወደ ዱባይ እየወረደ ነው…'],[1,'✅ ዱባይ ደረሰ! እቅፍሽን እየከፈትን ነው…']];
 const T0=performance.now(),D=11000;
 (function fr(now){const t=Math.min(1,(now-T0)/D),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;setPlane(e);
  $('tkm').textContent=Math.round(KM*(1-e)).toLocaleString()+' ኪ.ሜ ይቀራል';
  let st=stops[0];for(const s of stops)if(e>=s[0])st=s;$('tstat').textContent=st[1];
  if(t<1)requestAnimationFrame(fr);else land()})(T0)}
function land(){buzz('heavy');for(let k=0;k<6;k++)setTimeout(()=>burst(innerWidth*Math.random(),innerHeight*.35),k*200);setTimeout(openVid,1300)}
function openVid(){cur=0;const v=$('vid');$('vcap').textContent=`እቅፍ ቁጥር 1 ከ1 💞`;   // ⬅️ changed: always "1 ከ1"
 const src=picked[0]||VIDEOS[0];
 v.onerror=()=>{ if(v.getAttribute('src')){v.style.display='none';$('vpick').style.display='block'} };
 if(src){v.style.display='block';$('vpick').style.display='none';v.src=src;v.play().catch(()=>{})}
 else{v.style.display='none';v.removeAttribute('src');$('vpick').style.display='block'}
 $('vcard').classList.add('on')}
$('vclose').onclick=()=>{$('vid').pause();$('vcard').classList.remove('on');busy=false;$('roll').textContent='እቅፍ እዘዢ 🤗';$('tkm').textContent='ደርሷል ❤️'};
$('roll').onclick=fly;
$('vf').onchange=e=>{const f=e.target.files[0];if(f){picked[0]=URL.createObjectURL(f);$('tstat').textContent='🎬 ቪዲዮ ተጭኗል!'}};   // ⬅️ changed: only first file
$('vf1').onchange=e=>{const f=e.target.files[0];if(f){picked[0]=URL.createObjectURL(f);$('vpick').style.display='none';const v=$('vid');v.style.display='block';v.src=picked[0];v.play().catch(()=>{})}};
</script></body></html>
